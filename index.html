body {

h1 {

.instruccions {

}

.exercicis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 20px;
    max-width: 1300px;
    margin: auto;
}

.exercici {
    background: white;
    border: 3px solid #333;
    border-radius: 15px;
    padding: 18px;
    min-height: 230px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
}

.numero {
    font-size: 16px;
    font-weight: bold;
    text-align: left;
    margin-bottom: 15px;
}

.frase {
    font-size: 21px;
    line-height: 1.8;
    margin: 10px 0;
}

.icona {
    font-size: 38px;
    vertical-align: middle;
    margin: 0 5px;
}

input {
    width: 125px;
    max-width: 40%;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    border: none;
    border-bottom: 3px solid #333;
    background: #fffde8;
    padding: 5px;
    outline: none;
}

input:focus {
    background: #fff5bd;
    border-bottom-color: #2673b8;
}

.botons {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 13px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.corregir {
    background: #a8d5a2;
}

.reiniciar {
    background: #f4c6a6;
}

.play {
    background: #b8d9f5;
    font-size: 15px;
}

.missatge {
    font-size: 17px;
    font-weight: bold;
    min-height: 25px;
    margin-top: 10px;
}

@media (max-width: 500px) {
    .frase {
        font-size: 19px;
    }
}
</style>

const contenidor = document.getElementById("exercicis");

function normalitzar(text) {
    return text
        .trim()
        .toLocaleUpperCase("ca")
        .normalize("NFC");
}

dades.forEach((dada, index) => {

    const exercici = document.createElement("div");
    exercici.className = "exercici";

    const numero = document.createElement("div");
    numero.className = "numero";
    numero.textContent = "FRASE " + (index + 1);

    const frase = document.createElement("div");
    frase.className = "frase";

    const inici = document.createTextNode(dada.inici);

    const icona = document.createElement("span");
    icona.className = "icona";
    icona.textContent = dada.icona;

    const input = document.createElement("input");
    input.type = "text";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "Escriu la paraula que falta");

    const final = document.createTextNode(dada.final);

    frase.appendChild(inici);
    frase.appendChild(icona);
    frase.appendChild(input);
    frase.appendChild(final);

    const botons = document.createElement("div");
    botons.className = "botons";

    const botoPlay = document.createElement("button");
    botoPlay.className = "play";
    botoPlay.textContent = "▶ PLAY";

    const botoCorregir = document.createElement("button");
    botoCorregir.className = "corregir";
    botoCorregir.textContent = "CORREGIR";

    const botoReiniciar = document.createElement("button");
    botoReiniciar.className = "reiniciar";
    botoReiniciar.textContent = "TORNAR A COMENÇAR";

    const missatge = document.createElement("div");
    missatge.className = "missatge";

    botons.appendChild(botoPlay);
    botons.appendChild(botoCorregir);
    botons.appendChild(botoReiniciar);

    exercici.appendChild(numero);
    exercici.appendChild(frase);
    exercici.appendChild(botons);
    exercici.appendChild(missatge);

    contenidor.appendChild(exercici);

    // CORREGIR

    botoCorregir.addEventListener("click", () => {

        if (normalitzar(input.value) === normalitzar(dada.paraula)) {
            missatge.textContent = "MOLT BÉ! CORRECTE!";
            missatge.style.color = "green";
        } else {
            missatge.textContent = "TORNA-HO A PROVAR!";
            missatge.style.color = "red";
        }

    });

    // TORNAR A COMENÇAR

    botoReiniciar.addEventListener("click", () => {

        input.value = "";
        missatge.textContent = "";
        input.focus();

    });

    // LECTOR DE VEU EN CATALÀ

    botoPlay.addEventListener("click", () => {

        if (!("speechSynthesis" in window)) {
            missatge.textContent = "EL TEU NAVEGADOR NO PERMET LLEGIR EN VEU ALTA.";
            missatge.style.color = "red";
            return;
        }

        window.speechSynthesis.cancel();

        const fraseAudio = new SpeechSynthesisUtterance(dada.audio);
        fraseAudio.lang = "ca-ES";
        fraseAudio.rate = 0.85;
        fraseAudio.pitch = 1;

        const veus = window.speechSynthesis.getVoices();

        const veuCatala = veus.find(veu =>
            veu.lang.toLowerCase().startsWith("ca")
        );

        if (veuCatala) {
            fraseAudio.voice = veuCatala;
        }

        window.speechSynthesis.speak(fraseAudio);

    });

});

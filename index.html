
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Completa les frases</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
    color: #111;
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 25px;
}

.contenidor {
    max-width: 1000px;
    margin: auto;
}

.exercici {
    background: white;
    border: 2px solid #222;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.numero {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.frase {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 25px;
    line-height: 2;
    margin-bottom: 15px;
}

.paraula-audio {
    display: inline-block;
    padding: 1px 2px;
    border-radius: 3px;
}

.paraula-audio.activa {
    text-decoration: underline;
    text-decoration-thickness: 4px;
    text-underline-offset: 5px;
    background: #fff1a8;
}

.icona {
    font-size: 38px;
    margin: 0 5px;
}

input {
    width: 180px;
    max-width: 45vw;
    font-size: 23px;
    padding: 8px;
    border: 2px solid #333;
    border-radius: 6px;
    text-align: center;
    text-transform: uppercase;
}

.botons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.boto-audio {
    background: #d9eaff;
}

.boto-correcte {
    background: #d9f2d9;
}

.boto-reinicia {
    background: #eeeeee;
}

.resultat {
    font-size: 19px;
    font-weight: bold;
    margin-top: 12px;
    min-height: 24px;
}

.correcte {
    color: #16802b;
}

.incorrecte {
    color: #c00000;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .frase {
        font-size: 21px;
    }

    input {
        width: 140px;
        font-size: 20px;
    }

    button {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<h1>COMPLETA LES FRASES</h1>

<div class="contenidor" id="contenidor"></div>

<script>
const dades = [
{paraula:"BOMBER",icona:"🚒",inici:"El ",final:" apaga el foc."},
{paraula:"PALETA",icona:"👷",inici:"El ",final:" construeix una paret."},
{paraula:"METGE",icona:"🩺",inici:"El ",final:" visita els pacients."},
{paraula:"CUINERA",icona:"👩‍🍳",inici:"La ",final:" prepara el dinar."},
{paraula:"PINTOR",icona:"🖌️",inici:"El ",final:" pinta una paret."},
{paraula:"POLICIA",icona:"👮",inici:"El ",final:" ajuda les persones."},
{paraula:"CARTER",icona:"📮",inici:"El ",final:" reparteix les cartes."},
{paraula:"DENTISTA",icona:"🦷",inici:"El ",final:" revisa les dents."},

{paraula:"PAELLA",icona:"🥘",inici:"Avui mengem una ",final:"."},
{paraula:"MACARRONS",icona:"🍝",inici:"M'agrada menjar ",final:" amb tomàquet."},
{paraula:"XOCOLATA",icona:"🍫",inici:"La ",final:" és dolça."},
{paraula:"GELAT",icona:"🍦",inici:"A l'estiu menjo un ",final:"."},
{paraula:"MELÓ",icona:"🍈",inici:"El ",final:" és una fruita."},
{paraula:"PINYA",icona:"🍍",inici:"La ",final:" té una corona de fulles."},
{paraula:"CIRERA",icona:"🍒",inici:"La ",final:" és una fruita petita."},
{paraula:"PASTÍS",icona:"🧁",inici:"Avui és el meu aniversari i tinc un ",final:"."},

{paraula:"PARAIGÜES",icona:"☂️",inici:"Quan plou faig servir el ",final:"."},
{paraula:"CLAU",icona:"🔑",inici:"Obro la porta amb una ",final:"."},
{paraula:"RELLOTGE",icona:"⌚",inici:"Miro l'hora al ",final:"."},
{paraula:"MALETA",icona:"🧳",inici:"Quan viatjo, preparo la ",final:"."},
{paraula:"LLANTERNA",icona:"🔦",inici:"La ",final:" il·lumina la foscor."},
{paraula:"MIRALL",icona:"🪞",inici:"Em miro la cara al ",final:"."},
{paraula:"ESCOMBRA",icona:"🧹",inici:"Faig servir l'",final:" per netejar el terra."},
{paraula:"CANDELA",icona:"🕯️",inici:"La ",final:" fa llum."},

{paraula:"MICROSCOPI",icona:"🔬",inici:"Amb el ",final:" podem veure coses molt petites."},
{paraula:"ROBOT",icona:"🤖",inici:"El ",final:" pot fer diferents tasques."},
{paraula:"SATÈL·LIT",icona:"🛰️",inici:"El ",final:" gira al voltant de la Terra."},
{paraula:"COET",icona:"🚀",inici:"El ",final:" viatja a l'espai."},
{paraula:"PILA",icona:"🔋",inici:"La ",final:" dona energia a la joguina."},
{paraula:"CÀMERA",icona:"📷",inici:"Amb la ",final:" faig fotografies."},
{paraula:"MICRÒFON",icona:"🎤",inici:"Amb el ",final:" puc parlar i cantar."},
{paraula:"AURICULARS",icona:"🎧",inici:"Escolto música amb els ",final:"."},

{paraula:"FLAUTA",icona:"🪈",inici:"La ",final:" és un instrument musical."},
{paraula:"TROMPETA",icona:"🎺",inici:"La ",final:" fa un so molt fort."},
{paraula:"SAXÒFON",icona:"🎷",inici:"El ",final:" és un instrument de vent."},
{paraula:"NOTA",icona:"🎵",inici:"Aquesta ",final:" musical sona molt bé."},
{paraula:"PARTITURA",icona:"🎼",inici:"El músic llegeix la ",final:"."},
{paraula:"PALETA",icona:"🎨",inici:"El pintor posa els colors a la ",final:"."},
{paraula:"TEATRE",icona:"🎭",inici:"Anem al ",final:" a veure una obra."},
{paraula:"ESCULTURA",icona:"🗿",inici:"Al museu hi ha una ",final:" de pedra."}
];

const contenidor = document.getElementById("contenidor");

function normalitzar(text) {
    return text
        .trim()
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

// Converteix cada paraula visible en un element que es pot subratllar.
function crearTextAmbParaules(text, prefix) {
    return text.split(/(\s+)/).map((t, i) => {
        if (/^\s+$/.test(t)) {
            return document.createTextNode(t);
        }

        const span = document.createElement("span");
        span.className = "paraula-audio";
        span.textContent = t;
        span.dataset.idparaula = prefix + "-" + i;
        return span;
    });
}

// Crea les 40 activitats.
dades.forEach((dada, index) => {
    const exercici = document.createElement("div");
    exercici.className = "exercici";

    const numero = document.createElement("div");
    numero.className = "numero";
    numero.textContent = "FRASE " + (index + 1);

    const frase = document.createElement("div");
    frase.className = "frase";

    const inici = crearTextAmbParaules(dada.inici, "inici");
    inici.forEach(element => frase.appendChild(element));

    const icona = document.createElement("span");
    icona.className = "icona";
    icona.textContent = dada.icona;
    frase.appendChild(icona);

    const entrada = document.createElement("input");
    entrada.type = "text";
    entrada.setAttribute("aria-label", "Escriu la paraula");
    frase.appendChild(entrada);

    const final = crearTextAmbParaules(dada.final, "final");
    final.forEach(element => frase.appendChild(element));

    const botons = document.createElement("div");
    botons.className = "botons";

    const botoAudio = document.createElement("button");
    botoAudio.className = "boto-audio";
    botoAudio.textContent = "▶ PLAY";

    const botoCorregir = document.createElement("button");
    botoCorregir.className = "boto-correcte";
    botoCorregir.textContent = "CORREGIR";

    const botoReiniciar = document.createElement("button");
    botoReiniciar.className = "boto-reinicia";
    botoReiniciar.textContent = "TORNAR A COMENÇAR";

    const resultat = document.createElement("div");
    resultat.className = "resultat";

    botons.appendChild(botoAudio);
    botons.appendChild(botoCorregir);
    botons.appendChild(botoReiniciar);

    exercici.appendChild(numero);
    exercici.appendChild(frase);
    exercici.appendChild(botons);
    exercici.appendChild(resultat);

    contenidor.appendChild(exercici);

    // LECTURA DE LA FRASE SENSE DIR LA PARAULA QUE FALTA.
    botoAudio.addEventListener("click", () => {
        window.speechSynthesis.cancel();

        // Elimina tots els subratllats anteriors.
        document.querySelectorAll(".paraula-audio").forEach(p => {
            p.classList.remove("activa");
        });

        const paraules = [];

        // Agafem només les paraules que es veuen a la frase.
        const elements = [...inici, ...final];

        elements.forEach(element => {
            if (element.nodeType === 1) {
                paraules.push(element);
            }
        });

        let posicio = 0;

        function llegirSeguent() {
            if (posicio >= paraules.length) {
                return;
            }

            const element = paraules[posicio];

            // Subratlla la paraula que s'està llegint.
            document.querySelectorAll(".paraula-audio").forEach(p => {
                p.classList.remove("activa");
            });

            element.classList.add("activa");

            const veu = new SpeechSynthesisUtterance(
                element.textContent
            );

            veu.lang = "ca-ES";
            veu.rate = 0.85;
            veu.pitch = 1;

            const veus = window.speechSynthesis.getVoices();
            const veuCatala = veus.find(v =>
                v.lang.toLowerCase().startsWith("ca")
            );

            if (veuCatala) {
                veu.voice = veuCatala;
            }

            veu.onend = () => {
                posicio++;

                // Pausa més llarga quan arriba a l'espai de la resposta.
                if (posicio === inici.filter(e => e.nodeType === 1).length) {
                    setTimeout(llegirSeguent, 650);
                } else {
                    setTimeout(llegirSeguent, 100);
                }
            };

            veu.onerror = () => {
                posicio++;
                setTimeout(llegirSeguent, 100);
            };

            window.speechSynthesis.speak(veu);
        }

        if (paraules.length > 0) {
            llegirSeguent();
        }
    });

    // CORRECCIÓ DE LA RESPOSTA.
    botoCorregir.addEventListener("click", () => {
        if (normalitzar(entrada.value) === normalitzar(dada.paraula)) {
            resultat.textContent = "MOLT BÉ! RESPOSTA CORRECTA!";
            resultat.className = "resultat correcte";
        } else {
            resultat.textContent = "TORNA-HO A PROVAR!";
            resultat.className = "resultat incorrecte";
        }
    });

    // REINICI DE L'ACTIVITAT.
    botoReiniciar.addEventListener("click", () => {
        entrada.value = "";
        resultat.textContent = "";
        resultat.className = "resultat";

        document.querySelectorAll(".paraula-audio").forEach(p => {
            p.classList.remove("activa");
        });

        window.speechSynthesis.cancel();
    });
});

// Carrega les veus disponibles del navegador.
if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
}
</script>

</body>
</html>
